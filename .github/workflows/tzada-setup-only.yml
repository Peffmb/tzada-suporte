name: Tzada Suporte - só instalador

# Gera apenas o Tzada-Suporte-Setup.exe a partir dos arquivos do app de um build anterior
# (artefato rustdesk-unsigned-windows-x86_64), sem recompilar o app.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID do run do 'Tzada Suporte - Windows x64' que tem o app compilado"
        required: true
      version:
        description: "Versão exibida no instalador"
        required: true
        default: "1.5.3"

permissions:
  contents: read
  actions: read

jobs:
  setup:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Baixar o app compilado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: ./rustdesk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Gerar instalador
        shell: pwsh
        run: |
          if (-not (Test-Path ./rustdesk/Tzada.exe)) { throw "Tzada.exe não está no artefato" }
          New-Item -ItemType Directory -Force ./SignOutput | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $src = (Resolve-Path ./rustdesk).Path
          Push-Location tzada/setup
          & $iscc "/DAppVersion=${{ inputs.version }}" "/DSourceDir=$src" tzada-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou: $LASTEXITCODE" }
          Pop-Location
          Get-ChildItem ./SignOutput

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tzada-suporte-setup
          path: ./SignOutput/Tzada-Suporte-Setup.exe
          if-no-files-found: error
